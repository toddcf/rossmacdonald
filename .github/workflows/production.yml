name: Deploy production to DreamHost

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_PORT: ${{ secrets.DREAMHOST_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DREAMHOST_PORT" "$DREAMHOST_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to DreamHost
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          DREAMHOST_PORT: ${{ secrets.DREAMHOST_PORT }}
          DREAMHOST_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $DREAMHOST_PORT" \
            dist/ \
            "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_PATH"